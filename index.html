<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ec; font-family: system-ui, sans-serif; }
  .card { position: fixed; z-index: 10; background: rgba(255,255,255,.94); color: #223; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 13px; line-height: 1.5; }
  /* panel sterowania */
  #views { top: 12px; left: 12px; width: 250px; padding: 12px 14px; max-height: calc(100vh - 52px); overflow: auto; }
  #views section + section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #e3e7ec; }
  #views h2 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7a8594; margin: 0 0 6px; }
  #views button { border: 0; border-radius: 6px; background: #eef1f5; color: #223; cursor: pointer; font: inherit; padding: 6px 4px; }
  #views button:hover { background: #dfe6f3; }
  #views .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #views .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  #views .row:first-of-type { margin-top: 0; }
  #views .seg { display: flex; background: #eef1f5; border-radius: 6px; padding: 2px; }
  #views .seg button { background: transparent; padding: 3px 8px; font-size: 12px; color: #556; }
  #views .seg button.act { background: #2f5fb3; color: #fff; }
  #views label.row { cursor: pointer; user-select: none; }
  #views input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: #2f5fb3; }
  #views input[type=text] { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 8px; font: inherit;
    border: 1px solid #cfd6de; border-radius: 6px; }
  #views .vers { display: flex; flex-wrap: wrap; gap: 4px; }
  #views .vers button { padding: 4px 9px; font-size: 12px; }
  #views .vers button.act { background: #2f5fb3; color: #fff; }
  #views input[type=text]:disabled { background: #f3f5f8; }
  #views button:disabled { opacity: .45; cursor: default; background: #eef1f5; }
  #views .unit { color: #7a8594; font-size: 12px; }
  #views .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  #views .hint { color: #7a8594; font-size: 12px; }
  #views summary { cursor: pointer; font-weight: 600; }
  #views .steps { display: flex; align-items: center; gap: 6px; }
  #views .steps button { padding: 2px 8px; font-size: 12px; }
  #views .steps input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: #2f5fb3; }
  #views .steplbl { margin-top: 4px; font-size: 12px; line-height: 1.35; min-height: 2.7em; }
  #views .steplbl b { color: #c46a00; }
  #info table { border-collapse: collapse; margin-top: 4px; width: 100%; font-size: 12px; }
  #info td { padding: 0 6px 0 0; }
  #info td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; }
  /* lista elementów */
  #cut { top: 12px; right: 12px; padding: 10px 14px; max-height: calc(100vh - 48px); overflow: auto; }
  #cut summary { font-size: 14px; font-weight: 600; cursor: pointer; }
  #cut details[open] summary { margin-bottom: 4px; }
  #cut table { border-collapse: collapse; }
  #cut th { text-align: left; font-weight: 600; color: #667; font-size: 12px; padding: 0 10px 2px 0; }
  #cut td { padding: 0 10px 0 0; font-variant-numeric: tabular-nums; }
  #cut td:last-child, #cut th:last-child { padding-right: 0; }
  #cut tr[data-i]:hover { background: #ffe9c4; }
  #cut button { margin-top: 10px; width: 100%; border: 0; border-radius: 6px; background: #2f5fb3; color: #fff;
    font: inherit; font-weight: 600; padding: 7px; cursor: pointer; }
  #cut button:hover { background: #254c91; }
  #cut .warn { color: #c77700; cursor: help; font-size: 14px; }
  #cut .cost { margin-top: 10px; padding-top: 8px; border-top: 1px solid #dde; }
  #cut .cost h4 { margin: 0 0 4px; font-size: 13px; }
  #cut .cost table { width: 100%; }
  #cut .cost td:last-child { text-align: right; white-space: nowrap; }
  #cut .cost input { width: 52px; font: inherit; padding: 0 3px; text-align: right; }
  #cut .cost tr.tot td { font-weight: 700; border-top: 1px solid #dde; padding-top: 3px; }
  #cut .cost p { margin: 6px 0 0; font-size: 11px; color: #667; max-width: 420px; line-height: 1.35; }
  #tip { position: fixed; z-index: 20; display: none; max-width: 240px; background: #223; color: #fff;
    padding: 6px 9px; border-radius: 6px; font-size: 12px; line-height: 1.4; pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  /* etykiety wymiarów */
  .dim { background: #fff; color: #b3261e; border: 1px solid #b3261e; border-radius: 4px; padding: 0 4px;

  .dim.furn { color: #1a56b0; border-color: #1a56b0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  .h-touch { display: none; }
  @media (hover: none) { .h-mouse { display: none; } .h-touch { display: inline; } }
  /* telefon: karty jako wysuwane arkusze otwierane z dolnego paska */
  #mbar { display: none; }
  @media (max-width: 760px), (max-height: 500px) {
    #mbar { display: flex; gap: 8px; position: fixed; z-index: 15; left: 8px; right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom)); }
    #mbar button { flex: 1; border: 0; border-radius: 10px; padding: 11px 8px; font: inherit; font-size: 15px; font-weight: 600;
      background: rgba(255,255,255,.94); color: #223; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    #mbar button.act { background: #2f5fb3; color: #fff; }
    .card { display: none; }
    #views.open, #cut.open { display: block; top: auto; left: 8px; right: 8px; width: auto; box-sizing: border-box;
      bottom: calc(64px + env(safe-area-inset-bottom)); overflow: auto;
      max-height: calc(50vh - 72px); max-height: calc(50dvh - 72px - env(safe-area-inset-bottom));   /* arkusz + pasek ≤ pół ekranu */
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain; font-size: 14px; }
    #views button { padding: 9px 4px; }
    #views .seg button { padding: 7px 10px; font-size: 13px; }
    #views .vers { gap: 6px; }
    #views .vers button { padding: 8px 12px; font-size: 13px; }
    #views .steps button { padding: 8px 14px; font-size: 14px; }
    #views .steps { gap: 10px; }
    #views .steps input[type=range] { height: 32px; }
    #views .steplbl { min-height: 2.7em; }
    #views input[type=checkbox] { width: 22px; height: 22px; }
    #views .row { margin-top: 10px; }
    #cut summary { padding: 4px 0; }
    #cut .tbl { overflow-x: auto; }
    #cut td { padding: 3px 10px 3px 0; }
    #cut .tbl td:nth-child(3) { white-space: nowrap; }
    #cut .warn { font-size: 18px; padding: 0 4px; }
    #cut .cost input { width: 60px; padding: 3px; font-size: 16px; }   /* 16px: iOS nie przybliża przy pisaniu */
    #cut button { padding: 11px; }
    #tip { max-width: calc(100vw - 32px); }
  }
  @media (max-height: 500px) and (min-width: 600px) {   /* telefon poziomo: arkusz z boku */
    #mbar { left: auto; width: 320px; }
    #views.open, #cut.open { left: auto; right: 8px; width: 320px; top: 8px; bottom: calc(64px + env(safe-area-inset-bottom)); max-height: none; }  }

    "notes": "## Okucia i dodatki\n\n- Zawiasy do dwóch klap (fortepianowy na całą długość albo 3–4 zawiasy splatane na klapę); do klapy lewej z blachy fortepianowy ok. 640, czarny\n- Nity zrywalne Ø3,2 z szerokim kołnierzem (ok. 10) i nitownica ręczna – zawias do blachy klapy lewej (albo śrubki M3 z nakrętkami samokontrującymi)\n- Kołki rozporowe z wkrętami do przykręcenia boków do ścian\n- Konfirmaty do złożenia modułów: tył lewy (4), półka i tył prawy (8–12); 4 wkręty 30 mm albo śruby złączne meblowe do skręcenia przegród środkowych\n- Tymczasowa listewka do usztywnienia lewego modułu na czas montażu\n- 4 konfirmaty do płyty pod parapetem od góry (po 2 do boku lewego i prawego)\n- Konfirmaty lub wkręty do płyt, kołki drewniane i klej do ramki maskownicy\n- 10 wkrętów do płyt 3,5×12 z łbem płaskim lub soczewkowym i 10 podkładek M4 (czarne) do blachy maskownicy\n- Klej montażowy do przyklejenia blatu do parapetu\n- Obrzeże na widoczne krawędzie płyt (szczególnie nad kaloryferem i na kolumnie)\n- Pasek filcu lub uszczelki pod klapę z blachy\n- 4–5 kątowników meblowych (ok. 30×30, ramię min. 25): blat kolumny od spodu do boku lewego, boku kolumny (3) i części stałej przegrody (1), ewentualnie dół frontu kolumny do podłogi; 6 kołków Ø8×35 do frontu kolumny; 2 konfirmaty i 6 kołków Ø8×35 do ramki maskownicy\n- Drzwiczki boczne kolumny: 2 zawiasy (np. meblowe nawierzchniowe lub puszkowe do drzwi bocznych 90°), zatrzask magnetyczny przy froncie kolumny, mała gałka lub otwór na palec\n- Klej do drewna do wklejenia wypełnień w wcięciach blatu kolumny (ewentualnie rozety maskujące Ø35)\n- Taśma LED pod płytę pod parapetem (opcjonalnie)\n- Koryto na piony: jeden kawałek blachy perforowanej 1 mm (stal ocynkowana lub aluminium, prześwit min. 40 %, np. QG 10-15), gięty w U bez rantków (2 gięcia po 90°); rozwinięcie 330 × 1780 mm (115 + 100 + 115, wymiary zewnętrzne), od blatu kolumny do sufitu. Malowane na czarny mat (RAL 9005). Zmieści się na jednym arkuszu 1000×2000 razem z maskownicą kaloryfera i klapą lewą (obrócone, obok koryta) – zamówić razem\n- 2 kątowniki aluminiowe 15×15 × 1780 do mocowania boków koryta przy lewej ścianie, czarne wkręty z kołkami do ściany (ok. 5 na kątownik), śrubki M4 z nakrętkami i podkładkami poszerzanymi (DIN 9021) do boków koryta (ok. 8 na bok)\n- Farba żaroodporna czarna mat do pomalowania pionów (wtedy rur prawie nie widać przez perforację)\n\nŚciana pod oknem jest krzywa (parapet wystaje nad nią od 61 do 70 mm), dlatego moduły mają głębokość 197 zamiast 212 – 15 luzu do ściany pod oknem; czoła modułów są tam, gdzie były (212 od ściany). Pozostałe wymiary płyt są nominalne, bez luzu na nierówne ściany boczne.\n\n## Kolejność składania\n\n1. **Lewy moduł (nad kaloryferem).** Złożyć na podłodze, zanim stanie przy ścianie: bok lewy (197×984), przegroda środkowa lewa (197×984) i między nimi tył lewy górny (782×282), przy tylnych krawędziach, od 702 do 984 (równo z górą). Konfirmaty przez bok i przegrodę w krawędzie tyłu, po 2 na stronę – teraz można wiercić z zewnątrz, później bok lewy będzie przy ścianie. Na dole moduł jest otwarty (kaloryfer), więc na czas przenoszenia usztywnić go tymczasową listewką przykręconą na dole od przodu; sprawdzić kąt prosty (przekątne).\n2. **Prawy moduł.** Złożyć na podłodze: bok prawy (197×984), przegroda środkowa prawa (197×984), między nimi półka prawa (1234×197) górną powierzchnią na 300 i tył prawy górny (1234×684) stojący na półce przy tylnych krawędziach, od 300 do 984. Konfirmaty przez bok i przegrodę w krawędzie półki i tyłu (po 2–3 na krawędź) – przez bok prawy da się wiercić tylko teraz. Wychodzi sztywna skrzynka.\n3. **Ustawienie modułów.** Oba moduły wsunąć pod parapet (mają 984, do spodu parapetu jest 1005) – lewy do lewej ściany, prawy do prawej – ale nie dosuwać na siłę do ściany pod oknem: moduły mają 197 głębokości, a ich czoła mają stać w jednej prostej linii 212 od ściany pod oknem (mierzyć przy lewej ścianie, gdzie parapet wystaje 70; naciągnąć sznurek albo przyłożyć długą łatę). Z tyłu zostaje szczelina ok. 0–15 (tam, gdzie ściana wystaje najbardziej, najmniejsza) – nie widać jej. Jeśli ściana gdzieś wystaje bardziej i moduł nie wchodzi do linii, wysunąć oba moduły tak, żeby czoła dalej były w jednej linii (wtedy blat wystaje mniej). Przegrody środkowe stykają się – lewa powierzchnia lewej przegrody 800 od lewej ściany. Skręcić przegrody ze sobą 4 wkrętami 30 (albo śrubami złącznymi meblowymi), potem boki przykręcić do ścian bocznych kołkami rozporowymi (do ściany pod oknem nic się nie przykręca). Zdjąć tymczasową listewkę z lewego modułu. Moduły mają razem 2088 (lewy 800, prawy 1288), a wnęka ma 2090 przy podłodze w rogu i 2100 pod parapetem: lewy moduł dosunąć do lewej ściany, przy prawej zostaje ok. 2 (dół) do 12 (góra) szczeliny. Boku prawego nie dociągać do ściany na siłę – w szczelinę przy kołkach włożyć kliny lub podkładki, sprawdzić pion poziomicą i dopiero wtedy przykręcić. Jeśli moduły nie wchodzą, zeszlifować lub ściąć tylną krawędź boku przy ścianie, gdzie się klinuje.\n4. **Płyta pod parapetem** (2100×197, dociąć na miejscu). Przyłożyć, odrysować kształt ścian bocznych i dociąć wyżynarką na wcisk z 1–2 luzu. Wsunąć poziomo pod parapet, położyć na czterech pionach i tyłach, przodem równo z czołami pionów (z tyłu szczelina do ściany jak pod modułami); nad nią zostaje ok. 3 szczeliny do spodu parapetu (zakrywa ją listwa przednia). Kołki tu nie zadziałają – sterczące z pionów blokowałyby wsuwanie. Przykręcić od góry 4 konfirmatami do boku lewego i boku prawego (po 2 na bok) w przedniej części płyty – między przednią krawędzią parapetu (ok. 70 od ściany) a przodem płyty (212), dopóki nie ma blatu. Przegrody środkowe i tyły tylko podpierają płytę (bez mocowania).\n5. **Listwa przednia** (2100×71, dociąć na miejscu z 1–2 luzu). Do czoła płyty pod parapetem na kołki i klej; dolna krawędź (974) wystaje 10 poniżej spodu płyty i zachodzi na czoła pionów – tam też kołki. Górna krawędź równo z górą parapetu (1045), zakrywa szczelinę nad płytą.\n6. **Blat** (2100×250, dociąć na miejscu). Przyłożyć, odrysować ściany boczne (cyrklem lub klockiem prowadzonym po ścianie) i dociąć wyżynarką z 1–2 luzu. Położyć na parapecie i listwie przedniej, przodem równo z listwą (230 od ściany). Do parapetu klej montażowy (bez wiercenia), do górnej krawędzi listwy kołki i klej. Tylną krawędzią nie dosuwać do samej ramy okna – blat ma 18, szczelina pod oknem 17; zostawić kilka mm i sprawdzić, czy okno się otwiera.\n7. **Front prawy i listwa pod klapę.** Front (1300×720; prawą krawędź najpierw odrysować od prawej ściany i dociąć wyżynarką, żeby szczelina była 1–2) przykręcić do czół obu przegród środkowych, boku prawego i półki – od środka kątownikami albo na kołki, żeby nie było widać wkrętów. Sięga od podłogi do 720; lewa krawędź równo z lewą powierzchnią przegrody środkowej lewej (800 od lewej ściany), więc front zakrywa czoła obu przegród. Od środka, górą na 702 (spód klapy), przykręcić do frontu listwę pod klapę (1234×60) wkrętami przez listwę, maks. 30 długości, żeby nie przebić frontu.\n8. **Klapa prawa.** Zawiasami do tyłu prawego górnego, górna powierzchnia na 720. Przodem leży na listwie pod klapę. Luz 2 po bokach i z przodu.\n9. **Bok kolumny.** Bok kolumny (358×720) przykręcić do lewej ściany kołkami rozporowymi, tylną krawędzią do czoła boku lewego (kołki i klej), od 212 do 570 od ściany pod oknem.\n10. **Ramka maskownicy z częścią stałą przegrody.** Na podłodze złożyć ramkę: część stała przegrody przy rurach (702×100, pionowo) i dwie listwy 657×60 – dolna przy dole, górna górną krawędzią na 720 (od 660 do 720). Listwy zamówione jako pasy 657×100 z okleiną na jednej długiej krawędzi – dociąć do 60 od strony bez okleiny (ucięta krawędź listwy górnej idzie na dół, nad blachę – w razie potrzeby okleić ją obrzeżem na żelazko). Listwy dochodzą do prawej powierzchni części stałej przy jej tylnej krawędzi (tam, gdzie płaszczyzna frontu prawego); każdą łączy 1 konfirmat przez część stałą w czoło listwy i 1 kołek Ø8 z klejem – w czole listwy (60 × 18) mieszczą się dwa otwory, 15 i 45 od krawędzi, w osi grubości. Część stała nie jest przykręcana do podłogi – stoi na niej i trzymają ją listwy. Gotową ramkę dosunąć do lewej krawędzi frontu prawego (800) i połączyć prawe końce listew z frontem na kołki i klej – po 2 kołki Ø8 na listwę, 15 i 45 od jej krawędzi, w osi grubości (9 od lica). Część stała stoi wtedy lewą powierzchnią 125 od lewej ściany, od 212 do 312 od ściany pod oknem; ramka licuje z frontem prawym.\n11. **Blacha maskownicy.** Blacha 657×640, od 40 do 680 nad podłogą. Przykręcić od tyłu listew ramki z zakładem 20 u góry i u dołu, do obu listew co ok. 150 (po 5 wkrętów na listwę), 10 od krawędzi blachy. Wkręty do płyt z łbem płaskim lub soczewkowym 3,5×12 z podkładką – dłuższe niż 15 przebiłyby listwę (18) na froncie. W blasze nawiercić otwory Ø4 przed malowaniem (otwory perforacji Rv 3 są za małe na wkręt), w listwie otwory pilotowe Ø2; z boków blacha dochodzi do części stałej przegrody przy rurach i do przegrody środkowej. Rury są w kolumnie po lewej, więc blacha nie potrzebuje wycięć.\n12. **Klapa lewa z blachy.** Zawias fortepianowy (ok. 640, czarny) wzdłuż tylnej krawędzi klapy: jedno skrzydło na wierzchu blachy, przy krawędzi, przynitowane nitami zrywalnymi Ø3,2 z szerokim kołnierzem od spodu co ok. 60–80 (albo śrubki M3 z płaskim łbem od góry i nakrętką samokontrującą od spodu); drugie skrzydło przykręcone wkrętami 3,5×12 do lica tyłu lewego górnego, oś zawiasu na 720. Otwory w blasze pod nity nawiercić przed malowaniem, wg otworów zawiasu (perforacji nie używać – za małe i za blisko siebie). Klapa otwiera się do góry i opiera o tył lewy. Klapa zaczyna się 145 od lewej ściany (2 luzu od blatu kolumny) i przodem na całej szerokości leży na górnej listwie ramki; pod spód nakleić filc.\n13. **Blat kolumny.** Blat kolumny (537×125) trzymają od spodu kątowniki meblowe: 3 do lica boku lewego i boku kolumny przy lewej ścianie (ok. 100, 300 i 420 od ściany pod oknem – nie bliżej pionów, które są 480–560) i 1 do części stałej przegrody przy prawej krawędzi, który trzyma też część stałą z góry (drzwiczki wiszą na części stałej). Kątowniki przykręcić najpierw do pionowych płyt, górną półką na 702, potem położyć blat i przykręcić go od spodu wkrętami maks. 15; sięga od tyłu lewego górnego do 570 od ściany pod oknem (przednia krawędź równo z czołem boku kolumny – tu dojdzie front w kroku 14); górą na 720, równo z ramką i klapą lewą. Przed montażem wyciąć dwa wcięcia ok. 35 szer. od lewej krawędzi do ok. 55 od niej, w osiach pionów (ok. 460 i 510 od tylnej krawędzi płyty – zmierzyć na miejscu). Nasunąć płytę z prawej strony na rury, potem wkleić odcięte kawałki w szczeliny między rurą a bokiem (albo zamaskować rozetami). Blat zasłania też rurki biegnące wzdłuż lewej ściany nad kaloryferem; powyżej 720 piony zasłania koryto (krok 16).\n14. **Front kolumny.** Płyta 143×720, 570–588 od ściany pod oknem, nasadzana na kołki Ø8×35 z klejem: 4 kołki w czole boku kolumny (w osi jego grubości, 9 od lewej ściany; ok. 80, 280, 480 i 640 od podłogi) i 2 w przedniej krawędzi blatu kolumny (w osi grubości, 9 pod górą; ok. 50 i 115 od lewej ściany). Otwory we froncie wiercić od tyłu, najlepiej przez szablon do kołków. Prawy dolny róg frontu jest wolny – jeśli się odgina, dodać kątownik do podłogi. Rury zostają w środku kolumny; dostęp do nich przez drzwiczki boczne.\n15. **Drzwiczki boczne kolumny.** Płyta 694×253 między częścią stałą przegrody a frontem kolumny, lewą powierzchnią 125 od lewej ściany. Zawiasy przy tylnej krawędzi, do części stałej przegrody (oś obrotu w narożniku 143 od lewej ściany, 314 od ściany pod oknem); drzwiczki otwierają się w prawo, wzdłuż maskownicy. Luzy: 2 od części stałej, 3 od frontu kolumny (mniej nie wolno – przy otwieraniu przedni narożnik zbliża się do frontu), 6 od podłogi, 2 pod blatem. Zatrzask magnetyczny przy przedniej krawędzi (do frontu kolumny albo pod blatem kolumny). Przez drzwiczki jest dostęp do rur i do zaworu z boku.\n16. **Koryto na piony** (jedna blacha gięta w U, otwarta do lewej ściany), od blatu kolumny (720) do sufitu (2500; blacha 1780 – dociąć na miejscu, 3–5 luzu pod sufitem). Przed montażem pomalować piony na czarno. Koryto obejmuje same piony: boki odstają 115 od lewej ściany (czoło 115 od ściany, cofnięte o 10 względem drzwiczek kolumny), boki na 470 i 570 od ściany pod oknem (czoło 100). Przy suficie piony odstają od ściany bardziej niż przy podłodze – w najgorszym miejscu zostaje ok. 5 luzu do blachy. Dół stoi na blacie kolumny. Do lewej ściany przykręcić 2 kątowniki 15×15 na całą wysokość, tuż za bokami (od środka koryta); boki koryta przykręcić do nich śrubkami M4 z podkładkami poszerzanymi przez otwory perforacji (ok. 8 na bok). Koryto zostaje zdejmowane, żeby był dostęp do rur.\n\n## Do sprawdzenia przed zamówieniem\n\n- Ściana pod oknem: parapet wystaje nad nią 70 (lewo), 69 (środek), 61 (prawo), a od okna ma 90, 86, 86 – ściana jest krzywa o ok. 10 na szerokości. Zmierzyć też przy podłodze (odległość ściany od pionu spuszczonego z przedniej krawędzi parapetu): jeśli w dole ściana wychodzi do pokoju więcej niż 15 względem lewego końca pod parapetem, zmniejszyć głębokość modułów (boki, przegrody, półka, płyta pod parapetem) o różnicę.\n- Szerokość wnęki: 2100 pod parapetem, 2090 przy podłodze w rogu, 2095 przy podłodze ok. 200 od ściany pod oknem – ściany boczne zbiegają się ku dołowi. Moduły mają razem 2088 (prawy moduł zwężony o 12), czyli tylko 2 luzu w najwęższym miejscu – zmierzyć jeszcze raz przy podłodze w obu rogach i na wysokości ok. 500. Sprawdzić poziomicą, która ściana jest krzywa – jeśli lewa odchyla się w dole o więcej niż kilka mm, bok kolumny i front kolumny też trzeba podłożyć lub dociąć.\n- Wysokość spodu parapetu nad podłogą (1005) zmierzyć przy obu ścianach i w środku. Piony mają 984, płyta 18, więc zostaje 3 luzu; jeśli podłoga jest bardziej nierówna, skrócić piony bardziej – listwa przednia zakrywa szczelinę do ok. 10.\n- Front prawy, płyta pod parapetem, listwa przednia i blat są zamawiane na pełny wymiar (2100 i 1300) i docinane wyżynarką do ścian na miejscu. Laminat ciąć brzeszczotem do laminatu (zęby w dół, tzw. reverse) albo od spodu, krawędź oklejona taśmą malarską; docinana krawędź idzie do ściany, więc nie musi mieć obrzeża.\n- Grubość parapetu (40) zmierzyć w kilku miejscach; od niej zależy wysokość listwy przedniej.\n- Odległość pionów rur od ściany pod oknem (480–560) i od lewej ściany (35–65) – od tego zależą głębokość boku kolumny (570), położenie frontu kolumny i wcięcia w blacie kolumny.\n- Przegroda przy rurach i drzwiczki stoją 125 od lewej ściany; rura dolna w wybrzuszeniu sięga ok. 120 – tylko 5 luzu. Zmierzyć, gdzie rura dolna jest najdalej od ściany.\n- Czy obie rurki odgałęzień skręcają do kaloryfera bliżej ściany niż 212 (za płaszczyzną ramki). Jeśli nie – część stała przegrody lub blacha trafią na rurę.\n- Sprawdzić, czy skrzydło okna otwiera się nad blatem (blat ma 18, szczelina pod oknem 17).\n- Zmierzyć, ile od ściany odstaje gałka zaworu – za maskownicą jest 22 luzu przed kaloryferem.\n- Założenia niepotwierdzone: szczelina 17 między parapetem a oknem jest pionowa; szerokość kaloryfera 580 obejmuje zawór i gałkę; parapet kończy się 10 przed każdą ścianą boczną; brak listew przypodłogowych (jeśli będą – uwzględnić w bokach, froncie, ramce i kolumnie).\n- Wysokość osłony LED (10) pasuje tylko do płaskiej taśmy bez profilu.\n- Wysokość pokoju (2500) zmierzyć przy pionach – od niej zależy długość koryta. Sprawdzić, czy piony są pionowe i proste na całej wysokości.\n- Czy na pionach powyżej 720 są obejmy mocujące, przyłącza lub zawory – koryto musi je zmieścić (wnętrze ok. 114 × 98, od rur do blachy w najgorszym miejscu przy suficie tylko ok. 5).\n",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// =====================================================================
//  POKOJE — zapisane w bloku <script id="pokoje"> powyżej (dane, nie kod).
//  Układ: x = od lewej ściany w prawo, y = od podłogi w górę,
//         z = od ściany z oknem w głąb pokoju; wszystko w cm.
// =====================================================================
const isNum = v => Number.isFinite(v);
const isPt = p => Array.isArray(p) && p.length === 3 && p.every(isNum);
const isObjOf = (o, keys) => o && typeof o === 'object' && keys.every(k => isNum(o[k]));
const validRoom = r => r && typeof r.name === 'string' && r.name !== '' &&
  Array.isArray(r.size) && r.size.length === 2 && r.size.every(v => isNum(v) && v > 0) &&
  isNum(r.depth) && r.depth > 0 && isNum(r.wallT) &&
  isObjOf(r.window, ['x', 'w', 'h', 'recess', 'gap']) &&
  (r.window.split === undefined || (Array.isArray(r.window.split) && r.window.split.every(v => isNum(v) && v > 0 && v < 1))) &&
  isObjOf(r.sill, ['top', 't', 'out', 'over']) &&
  (r.radiators === undefined || (Array.isArray(r.radiators) && r.radiators.every(k =>
    isObjOf(k, ['x', 'y', 'z', 'w', 'h', 'd', 'ribs']) && k.ribs >= 1 &&
    (k.collectors === undefined || (Array.isArray(k.collectors) && k.collectors.every(isNum))) &&
    (k.valve === undefined || (['left', 'right'].includes(k.valve.side) && isNum(k.valve.w)))))) &&
  (r.pipes === undefined || (Array.isArray(r.pipes) && r.pipes.every(p =>
    p && isNum(p.r) && p.r > 0 && Array.isArray(p.points) && p.points.length >= 2 && p.points.every(isPt) &&
    (p.mat === undefined || ['pipe', 'metal', 'white'].includes(p.mat))))) &&
  (r.dims === undefined || (Array.isArray(r.dims) && r.dims.every(d => d && isPt(d.a) && isPt(d.b) && (d.off === undefined || isPt(d.off))))) &&
  (r.info === undefined || (Array.isArray(r.info) && r.info.every(x => Array.isArray(x) && x.length === 2))) &&
  (r.notes === undefined || typeof r.notes === 'string');
let ROOMS = [];
try { ROOMS = JSON.parse(document.getElementById('pokoje').textContent); } catch (err) { console.error('Blok pokoi w index.html jest uszkodzony', err); }
if (!Array.isArray(ROOMS)) ROOMS = [];
ROOMS = ROOMS.filter(r => validRoom(r) || (console.error('Pokój z niepoprawnymi danymi pominięty:', r && r.name), false));
let ROOM = null;                                // wybrany pokój (obiekt z ROOMS)
// wymiary pochodne pokoju (liczone w buildRoom)
const roomW = () => ROOM ? ROOM.size[0] : 210, roomH = () => ROOM ? ROOM.size[1] : 250;
const radTop = k => k.y + k.h;
const radSpan = k => {                          // zakres w x łącznie z zaworem i gałką
  const v = k.valve ? k.valve.w : 0;
  return [k.x - (k.valve && k.valve.side === 'left' ? v : 0), k.x + k.w + (k.valve && k.valve.side === 'right' ? v : 0)];
};
const radName = (k, i) => 'Kaloryfer' + (ROOM.radiators.length > 1 ? ` ${i + 1}` : '');

// ---------- scena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);

const VIEWS = () => {                           // ustawienia kamery zależą od szerokości pokoju
  const W = roomW(), s = Math.max(1, W / 210);  // szerszy pokój: kamera dalej
  return {
    persp: [[W * 0.8, 200 * s, 470 * s], [W / 2, 115, 0]],
    front: [[W / 2, 90, 420 * s],         [W / 2, 90, 0]],
    top:   [[W / 2, 520 * s, 60.01],      [W / 2, 0, 60]],
    side:  [[W + 380 * s, 90, 60],        [W / 2, 90, 60]],
  };
};
const viewFit = () => Math.max(1, 0.75 / camera.aspect);
let camFit = 1;
function setView(name) {
  const [p, t] = VIEWS()[name];
  // wąski ekran (telefon pionowo): kamera dalej, żeby cała szerokość ściany zmieściła się w kadrze
  const fit = camFit = viewFit();
  const pos = new THREE.Vector3(...p).sub(new THREE.Vector3(...t)).multiplyScalar(fit).add(new THREE.Vector3(...t));
  camera.position.copy(pos); controls.target.set(...t); controls.update();
}
// telefon: przy otwartym arkuszu środek rysunku przesuwa się na wolną część ekranu (górę albo lewą stronę)
// Tu liczony jest tylko cel; przejście do niego jest płynne (stepViewOffset w pętli rysowania).
const vo = { x: 0, y: 0, zoom: 1, tx: 0, ty: 0, tzoom: 1, dirty: false };
function updateViewOffset() {
  const c = mobileUI() && document.querySelector('#views.open, #cut.open');
  const W = innerWidth, H = innerHeight;
  vo.dirty = true;                                                // np. po zmianie rozmiaru okna
  if (!c) { vo.tx = vo.ty = 0; vo.tzoom = 1; return; }
  const r = c.getBoundingClientRect(), side = r.top < H / 4;      // arkusz z boku (telefon poziomo)
  const free = side ? r.left / W : r.top / H;                     // ułamek ekranu wolny od arkusza
  vo.tzoom = Math.min(1, Math.max(0.6, free * 1.7));
  vo.tx = side ? (W - r.left) / 2 : 0;
  vo.ty = side ? 0 : (H - r.top) / 2;
}
function stepViewOffset() {
  const moving = Math.abs(vo.tx - vo.x) + Math.abs(vo.ty - vo.y) + Math.abs(vo.tzoom - vo.zoom) * 500 > 0.3;
  if (!moving && !vo.dirty) return;
  const k = moving ? 0.15 : 1;                                    // ostatni krok: dokładnie do celu
  vo.x += (vo.tx - vo.x) * k; vo.y += (vo.ty - vo.y) * k; vo.zoom += (vo.tzoom - vo.zoom) * k;
  vo.dirty = moving;
  camera.zoom = vo.zoom;
  if (vo.x || vo.y) camera.setViewOffset(innerWidth, innerHeight, vo.x, vo.y, innerWidth, innerHeight);
  else camera.clearViewOffset();                                  // też przelicza macierz rzutowania
}
const touchUI = () => matchMedia('(hover: none)').matches;          // ekran dotykowy bez myszy
const mobileUI = () => matchMedia('(max-width: 760px), (max-height: 500px)').matches;
setView('persp');
document.querySelectorAll('#views button[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 10, far: 900 });
scene.add(sun);

// ---------- materiały ----------
const M = {
  wall:  new THREE.MeshStandardMaterial({ color: 0xf3ecdc, roughness: 0.95 }),
  floor: new THREE.MeshStandardMaterial({ color: 0xdfc8a4, roughness: 0.9 }),
  ceil:  new THREE.MeshStandardMaterial({ color: 0xf8f6f1, roughness: 0.95 }),
  white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  rad:   new THREE.MeshStandardMaterial({ color: 0xf4f2ec, roughness: 0.45 }),
  pipe:  new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.4 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9fd0f5, transparent: true, opacity: 0.45, roughness: 0.1 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xb8b8b8, roughness: 0.4, metalness: 0.6 }),
};

const room = new THREE.Group();
scene.add(room);

function box(w, h, d, x, y, z, mat, parent = room) {      // x,y,z = narożnik min
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x + w / 2, y + h / 2, z + d / 2);
  m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function pipe(a, b, r, mat = M.pipe, parent = room) {      // walec między punktami a i b
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = vb.clone().sub(va);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 20), mat);
  m.position.copy(va).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}

function tube(points, r, mat = M.pipe) {                    // gładka rura przez punkty
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, r, 16, false), mat);
  m.castShadow = m.receiveShadow = true;
  room.add(m); return m;
}

// ---------- pokój: budowany od nowa przy każdej zmianie pokoju ----------
function buildRoom() {
  room.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  room.clear();
  const [W, H] = ROOM.size, D = ROOM.depth, win = ROOM.window, sill = ROOM.sill;
  sun.position.set(W * 0.8, 320, 300);
  const sh = Math.max(300, W);
  Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh });
  sun.shadow.camera.updateProjectionMatrix();

  // ---------- podłoga i ściany ----------
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(W / 2, 0, D / 2);
  floor.receiveShadow = true;
  room.add(floor);

  // sufit — widoczny tylko od dołu (z góry przezroczysty) i nie rzuca cienia, bo słońce jest nad nim
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.ceil);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(W / 2, H, D / 2);
  ceil.receiveShadow = true;
  room.add(ceil);

  // ściany boczne — widoczne tylko od środka, żeby nie zasłaniały widoku z zewnątrz
  const sideGeo = new THREE.PlaneGeometry(D, H);
  const left = new THREE.Mesh(sideGeo, M.wall);
  left.rotation.y = Math.PI / 2; left.position.set(0, H / 2, D / 2);
  const right = new THREE.Mesh(sideGeo.clone(), M.wall);
  right.rotation.y = -Math.PI / 2; right.position.set(W, H / 2, D / 2);
  left.receiveShadow = right.receiveShadow = true;
  room.add(left, right);

  // ściana z oknem — z otworem
  const x0 = win.x, W0 = win.w, y0 = sill.top + win.gap, WH = win.h;
  {
    const s = new THREE.Shape();
    s.moveTo(0, 0); s.lineTo(W, 0); s.lineTo(W, H); s.lineTo(0, H); s.closePath();
    const h = new THREE.Path();
    h.moveTo(x0, y0); h.lineTo(x0, y0 + WH); h.lineTo(x0 + W0, y0 + WH); h.lineTo(x0 + W0, y0); h.closePath();
    s.holes.push(h);
    const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: ROOM.wallT, bevelEnabled: false }), M.wall);
    wall.position.z = -ROOM.wallT;
    wall.receiveShadow = true;
    room.add(wall);
  }

  // ---------- okno ----------
  {
    const fz = -win.recess - 7, fd = 7;          // rama: głębokość 7 cm
    const frame = (x, y, w, h, t, z, d) => {     // ramka prostokątna z 4 listew
      box(w, t, d, x, y, z, M.white); box(w, t, d, x, y + h - t, z, M.white);
      box(t, h - 2 * t, d, x, y + t, z, M.white); box(t, h - 2 * t, d, x + w - t, y + t, z, M.white);
    };
    frame(x0, y0, W0, WH, 5, fz, fd);            // ościeżnica
    const splits = (win.split || []).map(f => x0 + W0 * f).sort((a, b) => a - b);
    for (const sx of splits) {
      box(6, WH - 10, fd, sx - 3, y0 + 5, fz, M.white);                  // słupek
      box(1.5, 12, 3, sx - 6, y0 + WH / 2 - 6, fz + fd + 2, M.metal);   // klamka
    }
    if (!splits.length) box(1.5, 12, 3, x0 + W0 - 12, y0 + WH / 2 - 6, fz + fd + 2, M.metal);
    const sash = (x, w) => {                     // skrzydło
      frame(x, y0 + 4, w, WH - 8, 6, fz + 2, fd);
      box(w - 12, WH - 20, 1, x + 6, y0 + 10, fz + 5, M.glass).castShadow = false;
    };
    const edges = [x0 + 4 - 2, ...splits, x0 + W0 - 4 + 2];
    for (let i = 0; i + 1 < edges.length; i++) sash(edges[i] + 2, edges[i + 1] - 2 - (edges[i] + 2));

    // parapet wewnętrzny
    box(W0 + 2 * sill.over, sill.t, win.recess + sill.out,
        Math.max(0, x0 - sill.over), sill.top - sill.t, -win.recess, M.white)
      .scale.x = Math.min(1, (W - Math.max(0, x0 - sill.over)) / (W0 + 2 * sill.over));
  }

  // ---------- kaloryfery żeliwne ----------
  for (const k of ROOM.radiators || []) {
    const pitch = k.w / k.ribs, top = radTop(k), rz = k.z + k.d / 2;   // oś kaloryfera
    for (let i = 0; i < k.ribs; i++) {
      const x = k.x + i * pitch + 0.75;
      const w = pitch - 1.5;
      // żeberko: dwie kolumny + zaokrąglone góra/dół
      for (const dz of [-k.d / 2 + 2.5, k.d / 2 - 2.5])
        pipe([x + w / 2, k.y + 3, rz + dz], [x + w / 2, top - 3, rz + dz], w / 2, M.rad);
      box(w, 6, k.d - 3, x, k.y, k.z + 1.5, M.rad);
      box(w, 6, k.d - 3, x, top - 6, k.z + 1.5, M.rad);
    }
    // kolektory poziome (wysokości podłączeń)
    for (const y of k.collectors || []) pipe([k.x, y, rz], [k.x + k.w, y, rz], 2.6, M.rad);
    // nóżki
    for (const x of [k.x + pitch * 1.5, k.x + k.w - pitch * 1.5])
      pipe([x, 0, rz], [x, k.y + 1, rz], 0.8, M.metal);
  }

  // ---------- rury, zawory, uchwyty: 2 punkty = prosty odcinek, więcej = gładki łuk ----------
  const PIPE_MAT = { pipe: M.pipe, metal: M.metal, white: M.white };
  for (const p of ROOM.pipes || []) {
    const mat = PIPE_MAT[p.mat || 'pipe'];
    if (p.points.length === 2) pipe(p.points[0], p.points[1], p.r, mat);
    else tube(p.points, p.r, mat);
  }

  // ---------- tabela wymiarów pokoju ----------
  const rows = [
    ['Szerokość pokoju', W], ['Wysokość pokoju', H],
    ['Parapet – spód / góra', `${sill.top - sill.t} / ${sill.top}`],
    ['Parapet – wysunięcie od ściany', sill.out],
    ['Parapet – głębokość (od okna)', sill.out + win.recess],
  ];
  (ROOM.radiators || []).forEach((k, i) => {
    const n = radName(k, i), [a, b] = radSpan(k), g = k.valve ? `${n} z gałką` : n;
    rows.push([`${g}: od lewej ściany`, a], [`${g}: szerokość`, (b - a).toFixed(0)],
      [`${n} – góra`, radTop(k)], [`${n} – dół`, k.y], [`${n} – głęb. od ściany`, k.z + k.d]);
  });
  rows.push(...(ROOM.info || []));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  info.innerHTML = `<summary>Tabela wymiarów pokoju [cm]</summary><table>` +
    rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('') + '</table>';

  buildRoomDims();
  const act = document.querySelector('.seg[data-g="room"] button.act');
  setMode('room', act ? act.dataset.m : 'on');                     // zachowaj tryb widoczności pokoju
}
const info = document.getElementById('info');

// =====================================================================
//  PŁYTY MEBLOWE — size = [szer. X, wys. Y, głęb. Z] w cm, pos = narożnik
//  (lewy, dolny, najbliższy ścianie z oknem)
// =====================================================================
const T = 1.8;                                  // grubość płyty 18 mm
const DEFAULT_PANELS = [];                      // gdy nie ma żadnej poprawnej wersji: sam pokój
// --- wersje mebla: zapisane w bloku <script id="wersje"> powyżej (dodaje się je, edytując index.html) ---
const SEL_KEY = 'parapet.wybrana';              // localStorage: + '.<pokój>' = nazwa ostatnio wybranej wersji w tym pokoju
const ROOM_KEY = 'parapet.pokoj';               // localStorage: nazwa ostatnio wybranego pokoju
try { localStorage.removeItem('parapet.wersja.v1'); } catch { /* stary sposób zapisu – już nieużywany */ }
// drzwiczki (pionowa płyta cienka w X): krawędź z zawiasami (front = większe z, back = mniejsze z)
// i strona otwierania (right = +x, left = -x); wartość = znak kąta obrotu wokół osi Y
const DOOR_SWING = { 'front-right': -1, 'front-left': 1, 'back-right': 1, 'back-left': -1 };
const DOOR_PL = { 'front-right': 'zawiasy z przodu, otwierane w prawo', 'front-left': 'zawiasy z przodu, otwierane w lewo',
  'back-right': 'zawiasy z tyłu, otwierane w prawo', 'back-left': 'zawiasy z tyłu, otwierane w lewo' };
const validPanels = a => Array.isArray(a) && a.length > 0 && a.every(p => p && typeof p.name === 'string' &&

    setHovered(+tr.dataset.i === hovered ? null : +tr.dataset.i);
  });
}
// telefon: dolny pasek otwiera jedną kartę naraz jako arkusz
{
  const bar = document.getElementById('mbar');
  bar.onclick = e => {
    const b = e.target.closest('button[data-sheet]'); if (!b) return;
    const card = document.getElementById(b.dataset.sheet), open = !card.classList.contains('open');
    document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
    bar.querySelectorAll('button').forEach(x => x.classList.remove('act'));
    if (open) {
      card.classList.add('open'); b.classList.add('act');
      const d = card.querySelector(':scope > details'); if (d) d.open = true;
    }
    document.getElementById('tip').style.display = 'none';
    updateViewOffset();
  };
}
dimsToggle.onchange = furnToggle.onchange = applyDims; applyDims();

addEventListener('resize', () => {
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateViewOffset();
  // obrót telefonu: odsuń/przybliż kamerę o zmianę dopasowania, zachowując kąt patrzenia
  const f = viewFit();
  if (f !== camFit) {
    camera.position.sub(controls.target).multiplyScalar(f / camFit).add(controls.target);
    camFit = f; controls.update();
  }
});
// tryby widoczności: pełny / półprzezroczysty szkielet / ukryty
const ghostMats = {
  room:   new THREE.MeshBasicMaterial({ color: 0x7d8fa3, transparent: true, opacity: 0.10, depthWrite: false, side: THREE.DoubleSide }),
  panels: new THREE.MeshBasicMaterial({ color: 0x3a3a3a, transparent: true, opacity: 0.14, depthWrite: false, side: THREE.DoubleSide }),
};
const ghostEdge = new THREE.LineBasicMaterial({ color: 0x55657a, transparent: true, opacity: 0.6 });
const groups = { room, panels };
function setMode(name, mode) {
  const g = groups[name], ghost = mode === 'ghost';
  g.visible = mode !== 'off';
  const meshes = [];
  g.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    if (!o.userData.orig) { o.userData.orig = o.material; o.userData.cast = o.castShadow; }
    o.material = ghost ? ghostMats[name] : o.userData.orig;
    o.castShadow = ghost ? false : o.userData.cast;
    if (name === 'room') {                       // pokój dostaje krawędzie tylko w trybie szkieletu
      if (ghost && !o.userData.edges) {
        o.userData.edges = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), ghostEdge);
        o.add(o.userData.edges);
      }
      if (o.userData.edges) o.userData.edges.visible = ghost;
    }
  }
}
document.querySelectorAll('#views .seg').forEach(seg => seg.querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('act', x === b));
    setMode(seg.dataset.g, b.dataset.m);
  };
}));
// ---------- suwak składania: elementy pojawiają się w kolejności kroków (pole "step") ----------
// Tytuły kroków są brane z sekcji "## Kolejność składania" w notes (linie "N. **Tytuł.** ...").
const stepRange = document.getElementById('stepRange');
const stepLabel = document.getElementById('stepLabel');
const stepEdge = new THREE.LineBasicMaterial({ color: 0xff8a00 });   // krawędzie elementów bieżącego kroku
let stepList = [], stepTitles = {};
const panelStep = p => Number.isInteger(p.step) ? p.step : Infinity;   // bez kroku: dopiero w całości
function buildSteps() {
  stepList = [...new Set(PANELS.map(panelStep).filter(Number.isFinite))].sort((a, b) => a - b);
  stepTitles = {};
  const sec = (current && typeof current.notes === 'string' ? current.notes : '').split('## Kolejność składania')[1];
  if (sec) for (const mm of sec.split('\n## ')[0].matchAll(/^(\d+)\.\s+\*\*(.+?)\*\*/gm))
    stepTitles[+mm[1]] = mm[2].trim().replace(/[.:]$/, '');
  stepRange.max = stepList.length; stepRange.value = stepList.length;
  stepRange.disabled = document.getElementById('stepPrev').disabled =
    document.getElementById('stepNext').disabled = !stepList.length;
  applyStep();
}
function applyStep() {
  const k = +stepRange.value, all = k >= stepList.length;
  const cur = all ? Infinity : k ? stepList[k - 1] : -Infinity;
  PANELS.forEach((p, i) => {
    const s = panelStep(p);
    for (const o of panelRoots[i] || []) o.visible = all || s <= cur;
    const e = panelMeshes[i] && panelMeshes[i].userData.edge;
    if (e) e.material = !all && s === cur ? stepEdge : panelEdge;
  });
  const n = PANELS.filter(p => all || panelStep(p) <= cur).length;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  stepLabel.innerHTML = !stepList.length ? '<span class="hint">Ta wersja nie ma kroków składania</span>'
    : all ? `Całość – ${stepList.length} kroków, ${n} elementów`
    : !k ? 'Pusty pokój – przesuń suwak'
    : `<b>Krok ${cur}</b> (${k}/${stepList.length}): ${esc(stepTitles[cur] || '')}<br><span class="hint">elementów: ${n} z ${PANELS.length}</span>`;
  applyDims();
}
stepRange.oninput = applyStep;
document.getElementById('stepPrev').onclick = () => { stepRange.value = Math.max(0, +stepRange.value - 1); applyStep(); };
document.getElementById('stepNext').onclick = () => { stepRange.value = Math.min(stepList.length, +stepRange.value + 1); applyStep(); };

// ---------- pokoje i wersje: przełączniki ----------
{
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch { /* bez pamięci */ } };
  const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const roomNames = new Set(ROOMS.map(r => r.name));
  const showable = VERSIONS.filter(v => v && validPanels(v.panels) && roomNames.has(v.room));
  for (const v of VERSIONS) if (!showable.includes(v))
    console.error(v && roomNames.has(v.room) ? 'Wersja z niepoprawnymi elementami pominięta:' : 'Wersja bez znanego pokoju (pole "room") pominięta:', v && v.name);
  let inRoom = [];                                                   // wersje wybranego pokoju

  function select(v) {
    setHovered(null);
    current = v; PANELS = v ? v.panels : DEFAULT_PANELS;
    buildPanels(); buildCut(); buildFurnDims();
    const act = document.querySelector('.seg[data-g="panels"] button.act');
    setMode('panels', act ? act.dataset.m : 'on');                   // zachowaj tryb widoczności mebli
    buildSteps();                                                    // suwak składania: na start całość
    if (v) store(SEL_KEY + '.' + ROOM.name, v.name);
    $('verList').innerHTML = inRoom.length
      ? inRoom.map((x, i) => `<button data-i="${i}"${x === current ? ' class="act"' : ''}>${esc(x.name)}</button>`).join('')
      : '<span class="hint">Brak wersji dla tego pokoju</span>';
  }

  function selectRoom(r, first = false) {
    ROOM = r;
    store(ROOM_KEY, r.name);
    buildRoom();
    setView('persp');                                                // inny pokój = inna szerokość: kamera od nowa
    inRoom = showable.filter(v => v.room === r.name);
    $('roomList').innerHTML = ROOMS.map((x, i) => `<button data-i="${i}"${x === ROOM ? ' class="act"' : ''}>${esc(x.name)}</button>`).join('');
    const want = load(SEL_KEY + '.' + r.name) || (first ? load(SEL_KEY) : null);   // stary klucz: tylko przy pierwszym wczytaniu
    select(inRoom.find(v => v.name === want) || inRoom[0] || null);
  }

  $('verList').onclick = e => {
    const b = e.target.closest('button[data-i]');
    if (b) select(inRoom[+b.dataset.i]);
  };
  $('roomList').onclick = e => {
    const b = e.target.closest('button[data-i]');
    if (b && ROOMS[+b.dataset.i] !== ROOM) selectRoom(ROOMS[+b.dataset.i]);
  };

  if (ROOMS.length) {
    const n = load(ROOM_KEY), old = showable.find(v => v.name === load(SEL_KEY));
    selectRoom(ROOMS.find(r => r.name === n) || ROOMS.find(r => old && r.name === old.room) || ROOMS[0], true);
  } else {
    $('roomList').innerHTML = '<span class="hint">Brak pokoi w index.html</span>';
    select(null);
  }
}

const lidToggle = document.getElementById('lidToggle');
renderer.setAnimationLoop(() => {
  const target = lidToggle.checked ? -THREE.MathUtils.degToRad(85) : 0;
  for (const l of lids) l.rotation.x += (target - l.rotation.x) * 0.12;
  const open = lidToggle.checked ? THREE.MathUtils.degToRad(85) : 0;
  for (const { pivot, sign } of doors) pivot.rotation.y += (sign * open - pivot.rotation.y) * 0.12;
  stepViewOffset();
  controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); });
</script>
