ch i z przodu.\n8. **Lewa wnęka – tył.** Tył lewy górny postawić przy ścianie nad kaloryferem, tak samo jak po prawej.\n9. **Ramka maskownicy.** Pion lewy (40) przykręcić do czoła boku lewego. Listwę górną i dolną (760 × 60) połączyć na kołki i klej z pionem lewym; prawymi końcami dochodzą do lewej krawędzi frontu prawego (800 od lewej ściany, równo z lewą powierzchnią przegrody środkowej) – połączyć z nią na kołki i klej. Ramka licuje z frontem prawym.\n10. **Blacha maskownicy.** Wyciąć dwa wycięcia na rurki od lewej krawędzi (wysokość 140 i 645 – zmierzyć na miejscu). Przykręcić od tyłu ramki z zakładem 20 u góry, u dołu i z lewej; prawą krawędzią dochodzi do przegrody środkowej (800 od lewej ściany), do górnej listwy co ok. 150, żeby listwa nie uginała się pod klapą.\n11. **Klapa lewa z blachy.** Zawias przynitować lub przykręcić śrubkami do blachy i do tyłu lewego górnego. Przodem klapa leży na górnej listwie ramki; pod spód nakleić filc.\n\n## Do sprawdzenia przed zamówieniem\n\n- Szerokość 2100 to wymiar pokoju bez luzu – zmierzyć na wysokości parapetu i przy podłodze, odjąć 2–3 na nierówności ścian.\n- Grubość parapetu (40) zmierzyć w kilku miejscach; od niej zależy wysokość listwy przedniej.\n- Sprawdzić, czy skrzydło okna otwiera się nad blatem (blat ma 18, szczelina pod oknem 17).\n- Zmierzyć, ile od ściany odstaje gałka zaworu – za maskownicą jest 22 luzu przed kaloryferem.\n- Zmierzyć dokładnie, gdzie rurki przecinają płaszczyznę frontu; pion lewy ramki (40) ma ok. 8 luzu do górnej rurki.\n- Jeśli będą listwy przypodłogowe, uwzględnić je w bokach, froncie i ramce.\n- Wysokość osłony LED (10) pasuje tylko do płaskiej taśmy bez profilu.\n",

ntażowym i skręcić z listwą przednią.\n5. **Prawa wnęka – wnętrze.** Półkę prawą zamocować między przegrodą a bokiem prawym, górną powierzchnią na 300. Tył prawy górny (1264 × 687) postawić przy ścianie na półce prawej, od jej górnej powierzchni (300) do płyty pod parapetem (987); zakrywa ścianę w całej górnej części wnęki.\n6. **Front prawy.** Przykręcić do czół przegrody i boku prawego oraz do czoła półki. Sięga od podłogi do 720; lewa krawędź równo z lewą powierzchnią przegrody środkowej (800 od lewej ściany), więc front zakrywa czoło przegrody. Od środka, równo ze spodem klapy, przykręcić do frontu listwę pod klapę.\n7. **Klapa prawa.** Zawiasami do tyłu prawego górnego, górna powierzchnia na 720. Przodem leży na listwie pod klapę. Luz 2 po bokach i z przodu.\n8. **Lewa wnęka – tył.** Tył lewy górny postawić przy ścianie nad kaloryferem, tak samo jak po prawej.\n9. **Ramka maskownicy.** Listwę górną i dolną (657 × 60) wstawić w płaszczyźnie frontu prawego między część stałą przegrody przy rurach (143 od lewej ściany) a lewą krawędź frontu prawego (800). Oba końce połączyć na kołki i klej (z lewej można dodatkowo przykręcić przez część stałą). Ramka licuje z frontem prawym. Część stałą przegrody trzeba więc postawić wcześniej (krok 12 przenieść przed krok 9).\n10. **Blacha maskownicy.** Przykręcić od tyłu listew ramki z zakładem 20 u góry i u dołu, do górnej listwy co ok. 150; z boków blacha dochodzi do części stałej przegrody przy rurach i do przegrody środkowej. Rury są w kolumnie po lewej, więc blacha nie potrzebuje wycięć.\n11. **Klapa lewa z blachy.** Zawias przynitować lub przykręcić do blachy i do tyłu lewego górnego. Klapa zaczyna się 145 od lewej ściany (2 luzu od blatu kolumny) i przodem na całej szerokości leży na górnej listwie ramki; pod spód nakleić filc.\n12. **Bok kolumny i część stała przegrody** (zrobić przed krokiem 9). Bok kolumny (358×720) przykręcić do lewej ściany, tylną krawędzią do czoła boku lewego, od 212 do 570 od ściany pod oknem. Czę na górnej listwie ramki; pod spód nakleić filc.\n12. **Bok kolumny i część stała przegrody** (zrobić przed krokiem 9). Bok kolumny (358×720) przykręcić do lewej ściany, tylną krawędzią do czoła boku lewego, od 212 do 570 od ściany pod oknem. Część stałą przegrody przy rurach (702×60) postawić na podłodze, lewą powierzchnią 125 od lewej ściany, od 212 do 272 od ściany pod oknem; przykręcić kątownikiem do podłogi.\n13. **Front kolumny.** Płyta 143×720 przykręcona do czoła boku kolumny, 570–588 od ściany pod oknem; z prawej strony nie ma do czego jej przykręcić, więc dół przykręcić kątownikiem do podłogi, a górę do blatu kolumny (krok 14). Rury zostają w środku kolumny.\n14. **Blat kolumny.** Do boku lewego i boku kolumny przykręcić listwę pod blat kolumny (457×60), górą na 702, od tyłu lewego górnego do 5 przed pionami rur. Blat kolumny (552×125) leży na tej listwie i na części stałej przegrody; z przodu przykręcić go do frontu kolumny kątownikiem, między bokiem lewym/bokiem kolumny a krawędzią przegrody, od tyłu lewego górnego do frontu kolumny; górą na 720, równo z ramką i klapą lewą. Przed montażem wyciąć dwa wcięcia ok. 35 szer. od lewej krawędzi do ok. 55 od niej, w osiach pionów (ok. 470 i 520 od tylnej krawędzi płyty – zmierzyć na miejscu). Nasunąć płytę z prawej strony na rury, potem wkleić odcięte kawałki w szczeliny między rurą a bokiem (albo zamaskować rozetami). Blat zasłania też rurki biegnące wzdłuż lewej ściany nad kaloryferem; powyżej 720 piony zasłania koryto (krok 16).\n15. **Drzwiczki boczne kolumny.** Płyta 694×293 między częścią stałą przegrody a frontem kolumny, lewą powierzchnią 125 od lewej ściany. Zawiasy przy tylnej krawędzi, do części stałej przegrody (oś obrotu w narożniku 143 od lewej ściany, 274 od ściany pod oknem); drzwiczki otwierają się w prawo, wzdłuż maskownicy. Luzy: 2 od części stałej, 3 od frontu kolumny (mniej nie wolno – przy otwieraniu przedni narożnik zbliża się do frontu), 6 od podłogi, 2 pod blatem. Zatrzask magnetyczny przy przedniej krawędzi (do frontu kolumny albo pod blatem kolumny). Przez drzwiczki jest dostęp do rur i do zaworu z boku.\n16. **Koryto na piony** (jedna blacha gięta w U, otwarta do lewej ściany), od blatu kolumny (720) do sufitu (2500; blacha 1780 – dociąć na miejscu, 3–5 luzu pod sufitem). Przed montażem pomalować piony na czarno. Koryto obejmuje same piony z luzem ok. 25 z każdej strony: boki odstają 90 od lewej ściany (czoło 90 od ściany, cofnięte o 53 względem drzwiczek kolumny), boki na 455 i 585 od ściany pod oknem. Dół stoi na blacie kolumny. Rantki przykręcić do ściany czarnymi wkrętami (ok. 5 z każdej strony); koryto zostaje zdejmowane, żeby był dostęp do rur.\n\n## Do sprawdzenia przed zamówieniem\n\n- Szerokość 2100 to wymiar pokoju bez luzu – zmierzyć na wysokości parapetu i przy podłodze, odjąć 2–3 na nierówności ścian.\n- Grubość parapetu (40) zmierzyć w kilku miejscach; od niej zależy wysokość listwy przedniej.\n- Odległość pionów rur od ściany pod oknem (480–560) i od lewej ściany (35–65) – od tego zależą głębokość boku kolumny (570), położenie frontu kolumny i wcięcia w blacie kolumny.\n- Przegroda przy rurach i drzwiczki stoją 125 od lewej ściany; rura dolna w wybrzuszeniu sięga ok. 120 – tylko 5 luzu. Zmierzyć, gdzie rura dolna jest najdalej od ściany.\n- Czy obie rurki odgałęzień skręcają do kaloryfera bliżej ściany niż 212 (za płaszczyzną ramki). Jeśli nie – część stała przegrody lub blacha trafią na rurę.\n- Sprawdzić, czy skrzydło okna otwiera się nad blatem (blat ma 18, szczelina pod oknem 17).\n- Zmierzyć, ile od ściany odstaje gałka zaworu – za maskownicą jest 22 luzu przed kaloryferem.\n- Założenia niepotwierdzone: szczelina 17 między parapetem a oknem jest pionowa; szerokość kaloryfera 580 obejmuje zawór i gałkę; dół kaloryfera 100 nad podłogą; parapet kończy się 10 przed każdą ścianą boczną; brak listew przypodłogowych (jeśli będą – uwzględnić w bokach, froncie, ramce i kolumnie).\n- Wysokość osłony LED (10) pasuje tylko do płaskiej taśmy bez profilu.\n- Wysokość pokoju (2500) zmierzyć przy pionach – od niej zależy długość koryta. Sprawdzić, czy piony są pionowe i proste na całej wysokości.\n- Czy na pionach powyżej 720 są obejmy mocujące, przyłącza lub zawory – koryto musi je zmieścić (wnętrze ok. 89 × 128, od rur do blachy tylko ok. 25).\n",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// =====================================================================
//  WYMIARY (cm) — na razie SZACOWANE ze zdjęcia, do podmiany na dokładne
//  Układ: x = od lewej ściany w prawo, y = od podłogi w górę,
//         z = od ściany z oknem w głąb pokoju
// =====================================================================
const R = {
  roomW: 210,        // szerokość pokoju (ściana z oknem)
  roomH: 250,        // wysokość pokoju
  roomD: 180,        // ile głębokości pokoju pokazujemy
  wallT: 30,         // grubość ściany zewnętrznej

  winLeft: 3,        // lewa krawędź okna od lewej ściany
  winW: 204,         // szerokość otworu okiennego
  winH: 138,         // wysokość otworu okiennego
  winRecess: 2,      // cofnięcie ramy okna względem lica ściany
  winSplit: 0.43,    // udział lewego skrzydła w szerokości

  winGap: 1.7,       // szczelina między parapetem a oknem (przyjęta jako pionowa)

  sillH: 104.5,         // wysokość górnej powierzchni parapetu od podłogi
  sillT: 4,          // grubość parapetu
  sillOut: 7,        // wysunięcie parapetu przed lico ściany
  sillOver: 2,       // wystawanie parapetu na boki poza otwór

  radValve: 10,      // SZAC. miejsce na zawór z gałką po lewej (gałka zaczyna się 19 od ściany)
  radLeft: 29,       // lewa krawędź kaloryfera od lewej ściany
  radRibs: 7,        // liczba żeberek
  radRibPitch: 48 / 7,  // rozstaw żeberek
  radBottom: 10,     // dół kaloryfera nad podłogą
  radH: 59,          // wysokość kaloryfera
  radD: 14,          // głębokość kaloryfera
  radGap: 5,         // odstęp kaloryfera od ściany

  // --- rury (rzut z góry wg szkicu) ---
  pipeR: 1.5,        // piony: średnica 3 cm
  pipeX: 5,          // oś pionów od lewej ściany (3,5 odstępu + promień)
  pipeAZ: 49.5,      // pion A (bliżej okna): zajmuje 48–51 cm od rogu
  pipeBZ: 54.5,      // pion B (dalej od okna): zajmuje 53–56 cm od rogu
  branchR: 1.1,      // SZAC. promień gałązek
  supY: 64.5,        // wysokość osi górnej gałązki
  retY: 14,          // wysokość osi dolnej gałązki
  supOut: 7,         // górna gałązka: ile odstaje od lewej ściany na głębokości końca kaloryfera
  retOut: 11,        // dolna gałązka: jw.
  retBulge: 12,      // dolna gałązka: maks. odstawanie przy omijaniu pionu A (3,5 + 3 + 5,5)
};

const info = document.getElementById('info');
const rows = [
  ['Szerokość pokoju', R.roomW], ['Wysokość pokoju', R.roomH],
  ['Parapet – spód / góra', `${R.sillH - R.sillT} / ${R.sillH}`],
  ['Parapet – wysunięcie od ściany', R.sillOut],
  ['Parapet – głębokość (od okna)', R.sillOut + R.winRecess],
  ['Kaloryfer z gałką: od lewej ściany', R.radLeft - R.radValve],
  ['Kaloryfer z gałką: szerokość', (R.radValve + R.radRibs * R.radRibPitch).toFixed(0)],
  ['Kaloryfer – góra', R.radBottom + R.radH],
  ['Kaloryfer – dół (szac.)', R.radBottom],
  ['Kaloryfer – głęb. od ściany', R.radGap + R.radD],
  ['Piony: od lewej ściany (odstęp)', R.pipeX - R.pipeR],
  ['Piony: od rogu', `${R.pipeAZ - R.pipeR}–${R.pipeBZ + R.pipeR}`],
  ['Gałązki: wysokość osi', `${R.retY} / ${R.supY}`],
  ['Gałązki: odstają od lewej ściany', `${R.retOut} / ${R.supOut}`],
];
info.innerHTML = '<summary>Tabela wymiarów pokoju [cm]</summary><table>' +
  rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>';

// ---------- scena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);

const VIEWS = {
  persp: [[R.roomW * 0.8, 200, 470], [R.roomW / 2, 115, 0]],
  front: [[R.roomW / 2, 90, 420],     [R.roomW / 2, 90, 0]],
  top:   [[R.roomW / 2, 520, 60.01],  [R.roomW / 2, 0, 60]],
  side:  [[R.roomW + 380, 90, 60],    [R.roomW / 2, 90, 60]],
};
const viewFit = () => Math.max(1, 0.75 / camera.aspect);
let camFit = 1;
function setView(name) {
  const [p, t] = VIEWS[name];
  // wąski ekran (telefon pionowo): kamera dalej, żeby cała szerokość ściany zmieściła się w kadrze
  const fit = camFit = viewFit();
  const pos = new THREE.Vector3(...p).sub(new THREE.Vector3(...t)).multiplyScalar(fit).add(new THREE.Vector3(...t));
  camera.position.copy(pos); controls.target.set(...t); controls.update();
}
// telefon: przy otwartym arkuszu środek rysunku przesuwa się na wolną część ekranu (górę albo lewą stronę)
// Tu liczony jest tylko cel; przejście do niego jest płynne (stepViewOffset w pętli rysowania).
const vo = { x: 0, y: 0, zoom: 1, tx: 0, ty: 0, tzoom: 1, dirty: false };
function updateViewOffset() {
  const c = mobileUI() && document.querySelector('#views.open, #cut.open');
  const W = innerWidth, H = innerHeight;
  vo.dirty = true;                                                // np. po zmianie rozmiaru okna
  if (!c) { vo.tx = vo.ty = 0; vo.tzoom = 1; return; }
  const r = c.getBoundingClientRect(), side = r.top < H / 4;      // arkusz z boku (telefon poziomo)
  const free = side ? r.left / W : r.top / H;                     // ułamek ekranu wolny od arkusza
  vo.tzoom = Math.min(1, Math.max(0.6, free * 1.7));
  vo.tx = side ? (W - r.left) / 2 : 0;
  vo.ty = side ? 0 : (H - r.top) / 2;
}
function stepViewOffset() {
  const moving = Math.abs(vo.tx - vo.x) + Math.abs(vo.ty - vo.y) + Math.abs(vo.tzoom - vo.zoom) * 500 > 0.3;
  if (!moving && !vo.dirty) return;
  const k = moving ? 0.15 : 1;                                    // ostatni krok: dokładnie do celu
  vo.x += (vo.tx - vo.x) * k; vo.y += (vo.ty - vo.y) * k; vo.zoom += (vo.tzoom - vo.zoom) * k;
  vo.dirty = moving;
  camera.zoom = vo.zoom;
  if (vo.x || vo.y) camera.setViewOffset(innerWidth, innerHeight, vo.x, vo.y, innerWidth, innerHeight);
  else camera.clearViewOffset();                                  // też przelicza macierz rzutowania

function tube(points, r, mat = M.pipe) {                    // gładka rura przez punkty
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, r, 16, false), mat);
  m.castShadow = m.receiveShadow = true;
  room.add(m); return m;
}
{

  pipe([x, 0, R.pipeBZ], [x, R.roomH, R.pipeBZ], R.pipeR);

  // górna gałązka: z pionu A wzdłuż lewej ściany w stronę okna, potem w prawo do zaworu
  const valveX = R.radLeft - R.radValve;                    // tu zaczyna się zawór (19 cm)
  const sx = R.supOut - br, y1 = R.supY;                    // oś gałązki na głębokości końca kaloryfera
  const radEnd = R.radGap + R.radD;
  tube([[x, y1, R.pipeAZ], [x + 0.3, y1, R.pipeAZ - 8], [sx, y1, radEnd + 6], [sx, y1, radEnd],
        [sx + 1, y1, radZ + 3], [sx + 4, y1, radZ], [valveX + 1, y1, radZ]], br);
  // zawór z gałką
  pipe([valveX, y1, radZ], [R.radLeft, y1, radZ], 2.2, M.metal);
  pipe([valveX + 5, y1, radZ], [valveX + 5, y1, radZ + 7], 2.3, M.white);

  // dolna gałązka: z pionu B, omija pion A łukiem, biegnie do okna i skręca do dołu kaloryfera
  const rx = R.retOut - br, bx = R.retBulge - br, y2 = R.retY;
  tube([[x, y2, R.pipeBZ], [x + 3, y2, R.pipeBZ - 0.5], [bx - 1, y2, R.pipeBZ - 4], [bx, y2, R.pipeAZ - 3],
        [rx, y2, radEnd + 8], [rx, y2, radEnd], [rx + 1, y2, radZ + 3], [rx + 4, y2, radZ],
        [R.radLeft, y2, radZ]], br);

  // uchwyty pionów do ściany
  const by = R.roomH * 0.56;
  for (const z of [R.pipeAZ, R.pipeBZ]) pipe([0, by, z], [x, by, z], 0.6, M.metal);
}

function perfMat(w, h) {                        // blacha perforowana: czarna (malowana proszkowo) z przezroczystymi otworami
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#1e1e1e'; g.fillRect(0, 0, 64, 64);
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(32, 32, 20, 0, Math.PI * 2); g.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(w / 1.2, h / 1.2);             // podziałka otworów powiększona dla czytelności
  tex.anisotropy = 8;
  return new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.3,
    side: THREE.DoubleSide, metalness: 0.2, roughness: 0.7 });
}
function buildPanels() {
  panels.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  panels.clear();

for (const p of PANELS) {
  let m;
  const roots = [];                             // obiekty sceny tego elementu (klapa/drzwiczki: obrotnik + zawiasy)
  if (p.notch) {                                // płyta pionowa (bok) z wycięciem: profil w płaszczyźnie Z-Y
    const [w, h, d] = p.size, [nz, ny] = p.notch;
    const sh = new THREE.Shape();
    sh.moveTo(0, 0); sh.lineTo(d, 0); sh.lineTo(d, h); sh.lineTo(nz, h); sh.lineTo(nz, h - ny);
    sh.lineTo(0, h - ny); sh.closePath();
    m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: false }), panelMat);
    m.rotation.y = -Math.PI / 2;
    m.position.set(p.pos[0] + w, p.pos[1], p.pos[2]);
    m.castShadow = m.receiveShadow = true;
    panels.add(m);
  } else if (p.lid) {                           // klapa: obrót wokół tylnej górnej krawędzi
    const pivot = new THREE.Group();
    pivot.position.set(0, p.pos[1] + p.size[1], p.pos[2]);
    panels.add(pivot);
    if (p.mesh) {
      m = new THREE.Mesh(new THREE.PlaneGeometry(p.size[0], p.size[2]), perfMat(p.size[0], p.size[2]));
      m.rotation.x = -Math.PI / 2;
      m.position.set(p.pos[0] + p.size[0] / 2, -p.size[1] / 2, p.size[2] / 2);
      pivot.add(m);
    } else m = box(...p.size, p.pos[0], -p.size[1], 0, panelMat, pivot);
    lids.push(pivot); roots.push(pivot);
    for (const f of [0.12, 0.5, 0.88])          // zawiasy
      roots.push(pipe([p.pos[0] + p.size[0] * f - 3, pivot.position.y, p.pos[2]],
           [p.pos[0] + p.size[0] * f + 3, pivot.position.y, p.pos[2]], 0.5, M.metal, panels));
  } else if (p.door) {                          // drzwiczki: obrót wokół pionowej krawędzi z zawiasami
    const [w, h, d] = p.size, [hinge, side] = p.door.split('-');
    const px = side === 'right' ? p.pos[0] + w : p.pos[0], pz = hinge === 'front' ? p.pos[2] + d : p.pos[2];
    const pivot = new THREE.Group();
    pivot.position.set(px, 0, pz);
    panels.add(pivot);
    m = box(w, h, d, p.pos[0] - px, p.pos[1], p.pos[2] - pz, panelMat, pivot);
    doors.push({ pivot, sign: DOOR_SWING[p.door] }); roots.push(pivot);
    for (const f of [0.12, 0.88])               // zawiasy
      roots.push(pipe([px, p.pos[1] + h * f - 3, pz], [px, p.pos[1] + h * f + 3, pz], 0.5, M.metal, panels));
  } else if (p.mesh) {                          // pionowa blacha perforowana: cienka w Z (przodem do pokoju) albo w X (bokiem)
    const thinX = p.size[0] < p.size[2], w = thinX ? p.size[2] : p.size[0];
    m = new THREE.Mesh(new THREE.PlaneGeometry(w, p.size[1]), perfMat(w, p.size[1]));

    m.position.set(p.pos[0] + p.size[0] / 2, p.pos[1] + p.size[1] / 2, p.pos[2] + p.size[2] / 2);
    panels.add(m);
  } else m = box(...p.size, ...p.pos, p.color ? new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.7 }) : panelMat, panels);
  m.userData.edge = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), panelEdge);
  m.add(m.userData.edge);
  panelMeshes.push(m);
  panelRoots.push(roots.length ? roots : [m]);
}

function costMd() {                             // sekcja kosztu do eksportu .md (z cenami wpisanymi na stronie)

function buildCut() { // lista płyt do zamówienia (mm): dwa większe wymiary to format, najmniejszy to grubość
  const mm = v => Math.round(v * 10);

    const sillB = mm(SILL_B), sillT = mm(R.sillH);

Wygenerowano z modelu 3D. Wersja: ${current ? current.name : 'pusty pokój'}. Wszystkie wymiary w milimetrach.

## Pomieszczenie

- Parapet: spód na ${sillB}, góra na ${sillT}, wysunięty ${mm(R.sillOut)} przed ścianę pod oknem
- Kaloryfer: od ${mm(R.radLeft - R.radValve)} do ${mm(R.radLeft + R.radRibs * R.radRibPitch)} od lewej ściany, góra na ${mm(R.radBottom + R.radH)}, odstaje ${mm(R.radGap + R.radD)} od ściany

Kolumny położenia podają lewy dolny tylny narożnik elementu. Wartość ujemna w ostatniej kolumnie oznacza, że element wchodzi we wnękę okna (okno jest cofnięte 20 względem ściany pod parapetem).

${head}

${current && typeof current.notes === 'string' ? current.notes : ''}`;

const dims = new THREE.Group();

const fmt = v => String(Math.round(v * 10) / 10).replace('.', ',');
// wymiar między punktami a i b; off = odsunięcie linii wymiarowej (rysuje też linie pomocnicze)
function dim(a, b, off = [0, 0, 0], opt = {}) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), o = new THREE.Vector3(...off);
  const pa = va.clone().add(o), pb = vb.clone().add(o);
  const dir = pb.clone().sub(pa).normalize();
  // znaczniki końców: krótka kreska prostopadła
  let perp = new THREE.Vector3(0, 1, 0).cross(dir);
  if (perp.lengthSq() < 0.01) perp = new THREE.Vector3(1, 0, 0).cross(dir);
  perp.normalize().multiplyScalar(1.5);
  const pts = [pa, pb, va, pa, vb, pb,
    pa.clone().add(perp), pa.clone().sub(perp), pb.clone().add(perp), pb.clone().sub(perp)];
  const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), opt.mat || dimMat);
  line.renderOrder = 10;
  (opt.group || dims).add(line);
  const el = document.createElement('div');
  el.className = opt.cls || 'dim'; el.textContent = fmt(va.distanceTo(vb) * (opt.scale || 1));
  const lab = new CSS2DObject(el);
  lab.position.lerpVectors(pa, pb, opt.t ?? 0.5);
  (opt.group || dims).add(lab);
}
{
  const W = R.roomW, H = R.roomH, D = R.roomD;
  const radEnd = R.radGap + R.radD, vx = R.radLeft - R.radValve, rr = R.radLeft + radW;
  // pokój
  dim([0, 0, D], [W, 0, D], [0, 0, 6]);
  dim([W, 0, D], [W, H, D], [0, 0, 6]);
  // parapet
  const sb = R.sillH - R.sillT;
  dim([150, 0, R.sillOut], [150, sb, R.sillOut]);                      // spód parapetu od podłogi
  dim([W - 25, sb, R.sillOut], [W - 25, R.sillH, R.sillOut], [0, 0, 4]); // grubość
  dim([120, sb, 0], [120, sb, R.sillOut], [0, -3, 0]);                 // wysunięcie od ściany (dół)
  dim([95, R.sillH, -R.winRecess], [95, R.sillH, R.sillOut], [0, 3, 0]); // głębokość od okna (góra)
  // kaloryfer
  dim([0, radTop, radEnd], [vx, radTop, radEnd], [0, 10, 0]);          // od lewej ściany do gałki
  dim([vx, radTop, radEnd], [rr, radTop, radEnd], [0, 10, 0]);         // szerokość z gałką
  dim([rr, 0, radEnd], [rr, radTop, radEnd], [10, 0, 0]);              // góra
  dim([rr, 0, radEnd], [rr, R.radBottom, radEnd], [3, 0, 0]);          // dół
  dim([rr, radTop, 0], [rr, radTop, radEnd], [5, 0, 0]);               // głębokość od ściany
  // piony
  const x = R.pipeX, r = R.pipeR;
  dim([0, 110, R.pipeAZ], [x - r, 110, R.pipeAZ]);                     // odstęp od lewej ściany
  dim([x - r, 122, R.pipeAZ], [x + r, 122, R.pipeAZ]);                 // średnica
  dim([x + r, 135, 0], [x + r, 135, R.pipeAZ - r]);                    // od rogu do początku pionów
  dim([x + r, 150, 0], [x + r, 150, R.pipeBZ + r]);                    // od rogu do końca pionów
  // gałązki
  dim([R.supOut, 0, radEnd], [R.supOut, R.supY, radEnd], [0, 0, 12]);  // wysokość osi górnej
  dim([R.retOut, 0, radEnd], [R.retOut, R.retY, radEnd], [0, 0, 5]);   // wysokość osi dolnej
  dim([0, R.supY, radEnd], [R.supOut, R.supY, radEnd], [0, 5, 0]);     // górna: odstawanie od ściany
  dim([0, R.retY, radEnd], [R.retOut, R.retY, radEnd], [0, 5, 0]);     // dolna: odstawanie od ściany
  dim([0, R.retY, R.pipeAZ - 3], [R.retBulge, R.retY, R.pipeAZ - 3], [0, 8, 0]); // dolna: łuk
}
// wymiary mebla [mm]: dla każdego elementu dwa większe wymiary wzdłuż jego przednich/górnych krawędzi
const furnDims = new THREE.Group();

function buildFurnDims() {
  furnDims.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  furnDims.clear();                              // CSS2DObject sam usuwa swoją etykietę z DOM
  const fo = { group: furnDims, cls: 'dim furn', scale: 10,
    mat: new THREE.LineBasicMaterial({ color: 0x1a56b0, depthTest: false, transparent: true }) };
  PANELS.forEach((p, i) => {
    const thin = p.size.indexOf(Math.min(...p.size));
    const max = p.pos.map((v, k) => v + p.size[k]);
    const t = 0.25 + 0.5 * ((i * 0.37) % 1);              // rozsunięcie etykiet, żeby się nie nakładały
    const n0 = furnDims.children.length;
    for (let ax = 0; ax < 3; ax++) {
      if (ax === thin) continue;
      const a = [...max], b = [...max];
      a[ax] = p.pos[ax];
      dim(a, b, [0, 0, 0], { ...fo, t });
    }
    for (let k = n0; k < furnDims.children.length; k++) furnDims.children[k].userData.panel = i;
  });
}
const setVis = (g, on) => g.traverse(o => { o.visible = on; });
const dimsToggle = document.getElementById('dimsToggle');
const furnToggle = document.getElementById('furnToggle');
let hovered = null;                             // indeks elementu wskazanego na liście

const ghostMats = {
  room:   new THREE.MeshBasicMaterial({ color: 0x7d8fa3, transparent: true, opacity: 0.10, depthWrite: false, side: THREE.DoubleSide }),
  panels: new THREE.MeshBasicMaterial({ color: 0x3a3a3a, transparent: true, opacity: 0.14, depthWrite: false, side: THREE.DoubleSide }),
};
const ghostEdge = new THREE.LineBasicMaterial({ color: 0x55657a, transparent: true, opacity: 0.6 });
const groups = { room, panels };
function setMode(name, mode) {
  const g = groups[name], ghost = mode === 'ghost';
  g.visible = mode !== 'off';
  const meshes = [];
  g.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    if (!o.userData.orig) { o.userData.orig = o.material; o.userData.cast = o.castShadow; }
    o.material = ghost ? ghostMats[name] : o.userData.orig;
    o.castShadow = ghost ? false : o.userData.cast;
    if (name === 'room') {                       // pokój dostaje krawędzie tylko w trybie szkieletu
      if (ghost && !o.userData.edges) {
        o.userData.edges = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), ghostEdge);
        o.add(o.userData.edges);
      }
      if (o.userData.edges) o.userData.edges.visible = ghost;
    }
  }
}
document.querySelectorAll('#views .seg').forEach(seg => seg.querySelectorAll('button').forEach(b => {

// ---------- suwak składania: elementy pojawiają się w kolejności kroków (pole "step") ----------
// Tytuły kroków są brane z sekcji "## Kolejność składania" w notes (linie "N. **Tytuł.** ...").
const stepRange = document.getElementById('stepRange');
const stepLabel = document.getElementById('stepLabel');
const stepEdge = new THREE.LineBasicMaterial({ color: 0xff8a00 });   // krawędzie elementów bieżącego kroku
let stepList = [], stepTitles = {};
const panelStep = p => Number.isInteger(p.step) ? p.step : Infinity;   // bez kroku: dopiero w całości
function buildSteps() {
  stepList = [...new Set(PANELS.map(panelStep).filter(Number.isFinite))].sort((a, b) => a - b);
  stepTitles = {};
  const sec = (current && typeof current.notes === 'string' ? current.notes : '').split('## Kolejność składania')[1];
  if (sec) for (const mm of sec.split('\n## ')[0].matchAll(/^(\d+)\.\s+\*\*(.+?)\*\*/gm))
    stepTitles[+mm[1]] = mm[2].trim().replace(/[.:]$/, '');
  stepRange.max = stepList.length; stepRange.value = stepList.length;
  stepRange.disabled = document.getElementById('stepPrev').disabled =
    document.getElementById('stepNext').disabled = !stepList.length;
  applyStep();
}
function applyStep() {
  const k = +stepRange.value, all = k >= stepList.length;
  const cur = all ? Infinity : k ? stepList[k - 1] : -Infinity;
  PANELS.forEach((p, i) => {
    const s = panelStep(p);
    for (const o of panelRoots[i] || []) o.visible = all || s <= cur;
    const e = panelMeshes[i] && panelMeshes[i].userData.edge;
    if (e) e.material = !all && s === cur ? stepEdge : panelEdge;
  });
  const n = PANELS.filter(p => all || panelStep(p) <= cur).length;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  stepLabel.innerHTML = !stepList.length ? '<span class="hint">Ta wersja nie ma kroków składania</span>'
    : all ? `Całość – ${stepList.length} kroków, ${n} elementów`
    : !k ? 'Pusty pokój – przesuń suwak'
    : `<b>Krok ${cur}</b> (${k}/${stepList.length}): ${esc(stepTitles[cur] || '')}<br><span class="hint">elementów: ${n} z ${PANELS.length}</span>`;
  applyDims();
}
stepRange.oninput = applyStep;
document.getElementById('stepPrev').onclick = () => { stepRange.value = Math.max(0, +stepRange.value - 1); applyStep(); };
document.getElementById('stepNext').onclick = () => { stepRange.value = Math.min(stepList.length, +stepRange.value + 1); applyStep(); };

{
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const showable = VERSIONS.filter(v => v && validPanels(v.panels));
  for (const v of VERSIONS) if (!showable.includes(v)) console.error('Wersja z niepoprawnymi elementami pominięta:', v && v.name);

    const act = document.querySelector('.seg[data-g="panels"] button.act');
    setMode('panels', act ? act.dataset.m : 'on');                   // zachowaj tryb widoczności mebli
    buildSteps();                                                    // suwak składania: na start całość
    try { if (v) localStorage.setItem(SEL_KEY, v.name); } catch { /* bez pamięci */ }
    $('verList').innerHTML = showable.length
      ? showable.map((x, i) => `<button data-i="${i}"${x === current ? ' class="act"' : ''}>${esc(x.name)}</button>`).join('')

  }

  $('verList').onclick = e => {

  let start = null;

}
